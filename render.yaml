# Render Blueprint for the Django API. The React app is deployed on Vercel
# (see README > Deploy). New > Blueprint in the Render dashboard, pick this
# repo, then fill in the values marked `sync: false` when prompted.
services:
  - type: web
    name: routes-app-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One process: a plan prepared by the first request waits in its in-memory
    # cache for the browser to post the weather. Threads serve requests in parallel.
    startCommand: gunicorn config.wsgi --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      # The frontend's URL on Vercel, e.g. https://routes-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
